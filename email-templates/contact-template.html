<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Message from Flow State</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #000000;
      padding-bottom: 40px;
    }
    .main {
      background-color: #161616;
      margin: 0 auto;
      width: 100%;
      max-width: 600px;
      border-spacing: 0;
      border: 1px solid #27272a;
      border-radius: 12px;
      overflow: hidden;
    }
    .header {
      padding: 40px 30px 20px;
      text-align: center;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #ffffff;
      text-decoration: none;
    }
    .content {
      padding: 20px 30px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #ffffff;
    }
    .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #71717a;
      margin-top: 20px;
      margin-bottom: 4px;
    }
    .value {
      font-size: 15px;
      line-height: 1.6;
      color: #a1a1aa;
    }
    .message-box {
      background-color: #0e0e0e;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
    .footer {
      padding: 30px;
      text-align: center;
      font-size: 12px;
      color: #4a4a4a;
    }
    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #ffffff;
      color: #000000;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 700;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <table class="main" align="center">
      <tr>
        <td class="header">
          <div class="logo">Flow State</div>
        </td>
      </tr>
      <tr>
        <td class="content">
          <div class="title">New Contact Form Message</div>
          <p class="value">You have received a new message from the Flow State website.</p>
          
          <div class="label">From</div>
          <div class="value">{{name}} ({{email}})</div>
          
          <div class="label">Subject</div>
          <div class="value">{{subject}}</div>
          
          <div class="label">Message</div>
          <div class="message-box">
            <div class="value">{{message}}</div>
          </div>
          
          <center>
            <a href="mailto:{{email}}" class="button">Reply to User</a>
          </center>
        </td>
      </tr>
      <tr>
        <td class="footer">
          &copy; 2026 Flow State Productivity. All rights reserved.
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
