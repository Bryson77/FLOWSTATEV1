<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message from Flow State</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      line-height: 1.6;
    }
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #000000;
      padding-top: 60px;
      padding-bottom: 60px;
    }
    .main {
      margin: 0 auto;
      width: 100%;
      max-width: 540px;
      border-spacing: 0;
    }
    .header {
      padding-bottom: 40px;
      text-align: left;
    }
    .logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-decoration: none;
    }
    .content {
      background-color: #111111;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 40px;
    }
    .greeting {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 24px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .body-text {
      font-size: 16px;
      color: #a1a1aa;
      margin-bottom: 24px;
    }
    .cta-container {
      margin-top: 32px;
      text-align: left;
    }
    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #ffffff;
      color: #000000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .footer {
      padding-top: 40px;
      font-size: 12px;
      color: #4a4a4a;
    }
    .footer a {
      color: #71717a;
      text-decoration: none;
    }
    .sig {
      margin-top: 32px;
      font-size: 14px;
      color: #71717a;
    }
    @media screen and (max-width: 600px) {
      .content {
        padding: 30px 24px;
      }
      .wrapper {
        padding-top: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <table class="main" align="center">
      <tr>
        <td class="header">
          <div class="logo">Flow State</div>
        </td>
      </tr>
      <tr>
        <td class="content">
          <div class="greeting">Hey {{name}},</div>
          <div class="body-text">
            {{message_content}}
          </div>
          
          <div class="sig">
            Stay focused,<br>
            <strong>The Flow State Team</strong>
          </div>

          <div class="cta-container">
            <a href="https://flowstateproductivity.xyz" class="button">Back to Flow State</a>
          </div>
        </td>
      </tr>
      <tr>
        <td class="footer">
          &copy; 2026 Flow State Productivity. Made for deep work.<br>
          <a href="https://flowstateproductivity.xyz/privacy.html">Privacy</a> &bull; <a href="https://flowstateproductivity.xyz/terms.html">Terms</a>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
