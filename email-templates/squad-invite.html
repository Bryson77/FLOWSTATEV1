<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study invitation from Saktus</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #000000;
      padding: 60px 16px;
    }
    .main {
      margin: 0 auto;
      width: 100%;
      max-width: 480px;
      border-spacing: 0;
    }
    .logo-container {
      padding-bottom: 32px;
      text-align: center;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #ffffff;
      text-decoration: none;
      display: inline-block;
    }
    .content-card {
      background-color: #09090b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: left;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 12px 0;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .subtext {
      font-size: 14px;
      color: #a1a1aa;
      margin: 0 0 24px 0;
      line-height: 1.6;
    }
    .code-box {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin: 20px 0 28px 0;
    }
    .code-label {
      font-size: 11px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      font-family: monospace;
    }
    .code-value {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #ffffff;
      font-family: monospace;
    }
    .button {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 24px;
      background-color: #ffffff;
      color: #000000 !important;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
    }
    .footer {
      padding-top: 32px;
      text-align: center;
      font-size: 12px;
      color: #52525b;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <table class="main" align="center">
      <tr>
        <td class="logo-container">
          <span class="logo">Saktus</span>
        </td>
      </tr>
      <tr>
        <td class="content-card">
          <h1 class="title">Join a Study Session</h1>
          <p class="subtext">
            A classmate has invited you to study together in a live focus room on Saktus.
          </p>

          <div class="code-box">
            <div class="code-label">Room Code</div>
            <div class="code-value">{{ .RoomCode }}</div>
          </div>

          <a href="{{ .InviteURL }}" class="button" target="_blank">Join Study Room</a>
        </td>
      </tr>
      <tr>
        <td class="footer">
          Saktus Academic Platform<br>
          Courses · Timetable · Active Recall · Streaks
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
