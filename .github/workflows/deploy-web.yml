name: Deploy Web Application to Cloudflare Workers

on:
  push:
    branches:
      - main
      - WorkingBranch
    paths:
      - 'apps/web/**'
      - 'lib/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Saktus Web to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🏗️ Build Shared Packages
        run: |
          pnpm --filter @saktus/shared build || true
          pnpm --filter @saktus/study-engine build || true
          pnpm --filter @saktus/ui build || true

      - name: ⚡ Build Next.js Web App
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://maftkhcqxhjhhmkkgmpi.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hZnRraGNxeGhqaGhta2tnbXBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMzAwMDMsImV4cCI6MjEwNDgwNjAwM30.HU1g_pzl6oZ_UM4HbwdBdGKelWan3WAFxoHEmhTGLi0' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_OJF2PFZiNSoAuXyakmMxqw_XmaPaiIj' }}
        run: pnpm run build

      - name: 🚀 Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
