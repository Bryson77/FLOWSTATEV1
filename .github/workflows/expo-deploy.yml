name: Deploy Mobile to Expo (EAS Update)

on:
  push:
    branches:
      - main
      - WorkingBranch
    paths:
      - 'apps/mobile/**'
      - 'lib/**'
      - '.github/workflows/expo-deploy.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS channel / branch to publish update to'
        required: true
        default: 'preview'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: 🚀 Install EAS CLI
        run: npm install --global eas-cli

      - name: 💾 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: ⚡ Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📥 Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🏗️ Build Shared Packages
        run: |
          pnpm --filter @saktus/shared build || true
          pnpm --filter @saktus/study-engine build || true

      - name: 🔍 Typecheck Mobile App
        working-directory: apps/mobile
        run: pnpm run typecheck || true

      - name: 🚀 Publish EAS Update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: 1
        run: |
          BRANCH_NAME="${{ github.event.inputs.branch || 'production' }}"
          eas update --auto --branch "$BRANCH_NAME" --message "Deploy from GitHub Actions (commit ${{ github.sha }})" --non-interactive

