<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta name="description" content="Contact Flow State — get in touch with the team.">
<meta name="author" content="Flow State">
<meta property="og:title" content="Flow State · Contact">
<meta property="og:description" content="Get in touch with the Flow State team.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://flowstateproductivity.xyz/contact.html">
<meta property="og:image" content="https://flowstateproductivity.xyz/Logo.svg">
<link rel="canonical" href="https://flowstateproductivity.xyz/contact.html">
<link rel="icon" href="Logo.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Flow State</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root { --blue:#2563eb; --blue-lt:#4f86f7; --rad:12px; --rad-sm:8px; }
[data-theme="dark"] {
  --bg:#0e0e0e; --c1:#161616; --c2:#1e1e1e;
  --ln:rgba(255,255,255,0.07); --lnhi:rgba(255,255,255,0.13);
  --t1:#ededed; --t2:#999; --t3:#4a4a4a;
}
[data-theme="light"] {
  --bg:#f3f3f3; --c1:#fff; --c2:#eee;
  --ln:rgba(0,0,0,0.07); --lnhi:rgba(0,0,0,0.14);
  --t1:#111; --t2:#3d3d3d; --t3:#808080;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Geist',system-ui,sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;line-height:1.7;}
header{position:sticky;top:0;z-index:10;background:var(--c1);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:52px;}
.logo{font-size:0.88rem;font-weight:800;color:var(--t1);text-decoration:none;}
.logo span{color:var(--blue-lt);}
.back{font-size:0.72rem;font-weight:500;color:var(--t2);text-decoration:none;padding:5px 12px;border-radius:999px;border:1px solid var(--ln);transition:all 0.15s;}
.back:hover{border-color:var(--lnhi);color:var(--t1);}
.page{max-width:560px;margin:0 auto;padding:48px 32px 80px;}
.page-tag{font-size:0.6rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--t3);margin-bottom:10px;}
h1{font-size:2rem;font-weight:900;letter-spacing:-0.04em;color:var(--t1);margin-bottom:6px;line-height:1.1;}
.sub{font-size:0.82rem;color:var(--t2);margin-bottom:36px;line-height:1.6;}
.info-row{display:flex;gap:12px;margin-bottom:28px;}
.info-card{flex:1;background:var(--c1);border:1px solid var(--ln);border-radius:var(--rad-sm);padding:16px;}
.info-card-ic{font-size:1.2rem;margin-bottom:6px;}
.info-card-lbl{font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--t3);margin-bottom:3px;}
.info-card-val{font-size:0.75rem;color:var(--t2);}
.info-card-val a{color:var(--blue-lt);text-decoration:none;}
.info-card-val a:hover{text-decoration:underline;}
.form-card{background:var(--c1);border:1px solid var(--ln);border-radius:var(--rad);padding:28px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--t3);}
.field input,.field select,.field textarea{background:var(--c2);border:1px solid var(--ln);border-radius:var(--rad-sm);color:var(--t1);font-family:'Geist',sans-serif;font-size:0.82rem;padding:10px 14px;outline:none;transition:border-color 0.15s;width:100%;}
.field input::placeholder,.field textarea::placeholder{color:var(--t3);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}
.field textarea{resize:vertical;min-height:120px;line-height:1.6;}
.field select{cursor:pointer;}
.submit-btn{width:100%;padding:12px;border-radius:var(--rad-sm);border:none;background:var(--t1);color:var(--bg);font-family:'Geist',sans-serif;font-size:0.82rem;font-weight:800;cursor:pointer;transition:opacity 0.15s;margin-top:4px;}
.submit-btn:hover{opacity:0.85;}
.submit-btn:disabled{opacity:0.4;cursor:not-allowed;}
.status{margin-top:16px;padding:12px 16px;border-radius:var(--rad-sm);font-size:0.78rem;display:none;}
.status.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);color:#22c55e;display:block;}
.status.error{background:rgba(220,60,60,0.1);border:1px solid rgba(220,60,60,0.25);color:#e05252;display:block;}
footer{text-align:center;padding:32px;font-size:0.62rem;color:var(--t3);border-top:1px solid var(--ln);}
footer a{color:var(--t3);text-decoration:none;margin:0 8px;}
footer a:hover{color:var(--t2);}
@media(max-width:600px){.page{padding:32px 20px 60px;}header{padding:0 20px;}h1{font-size:1.5rem;}.info-row{flex-direction:column;}}
#cf-toast {
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--c1);border:1px solid var(--lnhi);
  border-radius:999px;padding:10px 24px;
  font-size:0.75rem;font-weight:600;color:var(--t1);
  opacity:0;transition:all 0.25s;pointer-events:none;
  z-index:999;white-space:nowrap;
  box-shadow:0 4px 24px rgba(0,0,0,0.3);
}
#cf-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">Flow <span>State</span></a>
  <a href="index.html" class="back">← Back to timer</a>
</header>

<div class="page">
  <div class="page-tag">Get in touch</div>
  <h1>Contact us</h1>
  <p class="sub">Have a question, found a bug, or just want to say hi? Send us a message and we'll get back to you within 24 hours.</p>

  <div class="info-row">
    <div class="info-card">
      <div class="info-card-ic">✉️</div>
      <div class="info-card-lbl">Email</div>
      <div class="info-card-val"><a href="/cdn-cgi/l/email-protection#ea828f868685aa8c86859d999e8b9e8f9a98858e9f899e839c839e93c4929390"><span class="__cf_email__" data-cfemail="1078757c7c7f50767c7f67636471647560627f7465736479667964693e68696a">[email&#160;protected]</span></a></div>
    </div>
    <div class="info-card">
      <div class="info-card-ic">⏱</div>
      <div class="info-card-lbl">Response time</div>
      <div class="info-card-val">Within 24 hours</div>
    </div>
  </div>

  <div class="form-card">
    <div class="field">
      <label for="cf-name">Your name</label>
      <input type="text" id="cf-name" placeholder="Lethabo" autocomplete="name">
    </div>
    <div class="field">
      <label for="cf-email">Email address</label>
      <input type="email" id="cf-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="cf-subject">Subject</label>
      <select id="cf-subject">
        <option value="">Select a topic...</option>
        <option value="Bug report">Bug report</option>
        <option value="Feature request">Feature request</option>
        <option value="Account issue">Account issue</option>
        <option value="General question">General question</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="field">
      <label for="cf-message">Message</label>
      <textarea id="cf-message" placeholder="Tell us what's on your mind..."></textarea>
    </div>
    <button class="submit-btn" id="cf-btn">Send message</button>
    <div class="status" id="cf-status"></div>
  </div>
</div>

<footer>
  <a href="index.html">Timer</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="privacy.html">Privacy Policy</a>
  <a href="terms.html">Terms of Service</a>
</footer>

<div id="cf-toast"></div>
<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
var toastTimer;
function showToast(msg) {
  var el = document.getElementById('cf-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 3000);
}

var WORKER_URL = 'https://emailworker.lethabomabilo53.workers.dev/contact';

document.getElementById('cf-btn').addEventListener('click', submitContact);

async function submitContact() {
  var name    = document.getElementById('cf-name').value.trim();
  var email   = document.getElementById('cf-email').value.trim();
  var subject = document.getElementById('cf-subject').value;
  var message = document.getElementById('cf-message').value.trim();
  var btn     = document.getElementById('cf-btn');
  var status  = document.getElementById('cf-status');

  status.className = 'status';
  status.textContent = '';

  if (!name || !email || !subject || !message) {
    status.className = 'status error';
    status.textContent = 'Please fill in all fields.';
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    status.className = 'status error';
    status.textContent = 'Please enter a valid email address.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    var res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, email: email, subject: subject, message: message })
    });
    var data = await res.json();
    if (res.ok) {
      status.className = 'status';
      showToast('Message sent! We will get back to you soon. ✓');
      document.getElementById('cf-name').value    = '';
      document.getElementById('cf-email').value   = '';
      document.getElementById('cf-subject').value = '';
      document.getElementById('cf-message').value = '';
    } else {
      throw new Error(data.error || 'Something went wrong');
    }
  } catch (e) {
    status.className = 'status error';
    status.textContent = 'Failed to send: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send message';
  }
}
</script>
</body>
</html>
