<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta name="description" content="Contact Flow State — get in touch with the team.">
<meta name="author" content="Flow State">
<meta property="og:title" content="Flow State · Contact">
<meta property="og:description" content="Get in touch with the Flow State team.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://flowstateproductivity.xyz/contact.html">
<meta property="og:image" content="https://flowstateproductivity.xyz/Logo.svg">
<link rel="canonical" href="https://flowstateproductivity.xyz/contact.html">
<link rel="icon" href="Logo.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Flow State</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.page { max-width:640px; margin:0 auto; padding:64px 24px 100px; position:relative; z-index:1; }
.page-tag { font-size:0.6rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--t3); margin-bottom:12px; }
h1 { font-size:2.4rem; font-weight:900; letter-spacing:-0.04em; color:var(--t1); margin-bottom:10px; line-height:1.1; font-family:'Outfit',sans-serif; }
.sub { font-size:0.88rem; color:var(--t2); margin-bottom:40px; line-height:1.6; }

.info-row { display:flex; gap:12px; margin-bottom:32px; }
.sc.info-card { flex:1; padding:20px; }
.info-card-ic { font-size:1.4rem; margin-bottom:8px; }
.info-card-lbl { font-size:0.58rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--t3); margin-bottom:4px; }
.info-card-val { font-size:0.75rem; color:var(--t2); font-weight:500; }
.info-card-val a { color:var(--accent-lt); text-decoration:none; }
.info-card-val a:hover { text-decoration:underline; }

.sc.form-card { padding:32px; text-align:left; }
.field { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
.field label { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--t3); }
.field input, .field select, .field textarea { 
  background:var(--c2); border:1px solid var(--ln); border-radius:var(--rad-sm); 
  color:var(--t1); font-family:'Inter',sans-serif; font-size:0.82rem; padding:11px 14px; 
  outline:none; transition:border-color 0.15s; width:100%; 
}
.field input:focus, .field select:focus, .field textarea:focus { border-color:var(--accent-lt); }
.field textarea { resize:vertical; min-height:140px; line-height:1.6; }

.submit-btn { 
  width:100%; padding:14px; border-radius:var(--rad-sm); border:none; 
  background:var(--t1); color:var(--bg); font-family:'Inter',sans-serif; 
  font-size:0.82rem; font-weight:800; cursor:pointer; transition:opacity 0.15s; 
  margin-top:8px; 
}
.submit-btn:hover { opacity:0.85; }
.submit-btn:disabled { opacity:0.4; cursor:not-allowed; }

.status { margin-top:16px; padding:14px 18px; border-radius:var(--rad-sm); font-size:0.75rem; display:none; }
.status.success { background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.25); color:var(--green); display:block; }
.status.error { background:rgba(220,60,60,0.1); border:1px solid rgba(220,60,60,0.25); color:#e05252; display:block; }

#cf-toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px);
  background:var(--c1); border:1px solid var(--lnhi); border-radius:999px; 
  padding:10px 24px; font-size:0.75rem; font-weight:600; color:var(--t1);
  opacity:0; transition:all 0.25s; pointer-events:none; z-index:999;
  box-shadow:0 4px 24px rgba(0,0,0,0.3); backdrop-filter:blur(20px);
}
#cf-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media(max-width:600px) { h1 { font-size:1.8rem; } .info-row { flex-direction:column; } }
</style>
</head>
<body>

<div class="mesh-bg"></div>

<header id="bar">
  <a href="index.html" class="logo" style="text-decoration:none">Flow State</a>
  <div class="bar-right">
    <a href="index.html" class="bar-btn" style="text-decoration:none">&larr; Back to Timer</a>
  </div>
</header>

<div class="page">
  <div class="page-tag">Get in touch</div>
  <h1>Contact us</h1>
  <p class="sub">Have a question, found a bug, or just want to say hi? Send us a message and we'll get back to you within 24 hours.</p>

  <div class="info-row">
    <div class="sc info-card">
      <div class="info-card-ic">✉️</div>
      <div class="info-card-lbl">Email</div>
      <div class="info-card-val"><a href="/cdn-cgi/l/email-protection#ea828f868685aa8c86859d999e8b9e8f9a98858e9f899e839c839e93c4929390"><span class="__cf_email__" data-cfemail="1078757c7c7f50767c7f67636471647560627f7465736479667964693e68696a">[email&#160;protected]</span></a></div>
    </div>
    <div class="sc info-card">
      <div class="info-card-ic">⏱</div>
      <div class="info-card-lbl">Response time</div>
      <div class="info-card-val">Within 24 hours</div>
    </div>
  </div>

  <div class="sc form-card">
    <div class="field">
      <label for="cf-name">Your name</label>
      <input type="text" id="cf-name" placeholder="Lethabo" autocomplete="name">
    </div>
    <div class="field">
      <label for="cf-email">Email address</label>
      <input type="email" id="cf-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="cf-subject">Subject</label>
      <select id="cf-subject">
        <option value="">Select a topic...</option>
        <option value="Bug report">Bug report</option>
        <option value="Feature request">Feature request</option>
        <option value="Account issue">Account issue</option>
        <option value="General question">General question</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="field">
      <label for="cf-message">Message</label>
      <textarea id="cf-message" placeholder="Tell us what's on your mind..."></textarea>
    </div>
    <button class="submit-btn" id="cf-btn">Send message</button>
    <div class="status" id="cf-status"></div>
  </div>
</div>

<footer id="main-footer">
  <span>© 2026 Flow State</span>
  <div class="footer-links">
    <a href="index.html">Timer</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
  </div>
</footer>

<div id="cf-toast"></div>
<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
var toastTimer;
function showToast(msg) {
  var el = document.getElementById('cf-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 3000);
}

var WORKER_URL = 'https://emailworker.lethabomabilo53.workers.dev/contact';

document.getElementById('cf-btn').addEventListener('click', submitContact);

async function submitContact() {
  var name    = document.getElementById('cf-name').value.trim();
  var email   = document.getElementById('cf-email').value.trim();
  var subject = document.getElementById('cf-subject').value;
  var message = document.getElementById('cf-message').value.trim();
  var btn     = document.getElementById('cf-btn');
  var status  = document.getElementById('cf-status');

  status.className = 'status';
  status.textContent = '';

  if (!name || !email || !subject || !message) {
    status.className = 'status error';
    status.textContent = 'Please fill in all fields.';
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    status.className = 'status error';
    status.textContent = 'Please enter a valid email address.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    var res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, email: email, subject: subject, message: message })
    });
    var data = await res.json();
    if (res.ok) {
      status.className = 'status';
      showToast('Message sent! We will get back to you soon. ✓');
      document.getElementById('cf-name').value    = '';
      document.getElementById('cf-email').value   = '';
      document.getElementById('cf-subject').value = '';
      document.getElementById('cf-message').value = '';
    } else {
      throw new Error(data.error || 'Something went wrong');
    }
  } catch (e) {
    status.className = 'status error';
    status.textContent = 'Failed to send: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send message';
  }
}
</script>
</body>
</html>
